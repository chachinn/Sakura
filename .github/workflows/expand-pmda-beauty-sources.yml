name: Complete Reading Garden Beauty sources with PMDA

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/expand-pmda-beauty-sources.yml
      - tools/enable-pmda-beauty-sources.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete-beauty:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Reading Garden branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: complete-open-reading-garden-20260822

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Register guarded PMDA source family
        run: node tools/enable-pmda-beauty-sources.mjs

      - name: Syntax check discovery
        run: node --check tools/discover-reading-article-topic-sources.mjs

      - name: Discover complete topic-balanced Article sources
        run: node tools/discover-reading-article-topic-sources.mjs

      - name: Require exact 300-source balance
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=require('./data/reading/qa/article-topic-source-discovery.json');
          const c=require('./data/reading/qa/article-topic-source-candidates.json');
          const expected=['beauty','food','travel','digital','consumer','health','environment','culture','work','society'];
          const counts=Object.fromEntries(expected.map(t=>[t,c.records.filter(x=>x.articleTopic===t).length]));
          const urls=new Set(c.records.map(x=>x.sourceUrl));
          const bodies=new Set(c.records.map(x=>x.sourceBodyFingerprint));
          if(!r.pass||c.records.length!==300||urls.size!==300||bodies.size!==300||expected.some(t=>counts[t]!==30)) {
            console.error({pass:r.pass,gaps:r.gaps,count:c.records.length,uniqueUrls:urls.size,uniqueBodies:bodies.size,counts});
            process.exit(1);
          }
          console.log(JSON.stringify({pass:true,count:c.records.length,uniqueUrls:urls.size,uniqueBodies:bodies.size,counts,pmda:c.records.filter(x=>x.sourceFamilyId==='gov-pmda').length},null,2));
          NODE

      - name: Promote balanced Article source pack
        run: cp data/reading/qa/article-topic-source-candidates.json data/reading/body-ready/articles.json

      - name: Validate full body-ready inventory
        run: node tools/validate-reading-body-ready.mjs

      - name: Validate source rights foundation
        run: node tools/validate-reading-rights.mjs

      - name: Check generated diff
        run: git diff --check

      - name: Commit verified PMDA completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/reading/source-registry.json tools/discover-reading-article-topic-sources.mjs data/reading/qa/article-topic-source-discovery.json data/reading/qa/article-topic-source-candidates.json data/reading/body-ready/articles.json
          git commit -m "Complete topic-balanced Article source inventory"
          git push origin HEAD:complete-open-reading-garden-20260822
