name: Build Sakura N1 Vocabulary

on:
  push:
    branches:
      - n1-vocab-build
    paths:
      - scripts/build_n1_vocab.py
      - .github/workflows/build-n1-vocab.yml
      - data/vocabulary/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Sakura
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install romanization dependency
        run: python -m pip install --disable-pip-version-check pykakasi==2.3.0

      - name: Build N1 vocabulary
        run: python scripts/build_n1_vocab.py

      - name: Parse generated JSON with Node
        run: node -e "const fs=require('fs'); const p='build/n1-vocab/data/vocabulary/n1.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(x.length!==4000) process.exit(1); console.log('Node JSON parse PASS:',x.length);"

      - name: Package direct-download ZIP
        run: |
          cd build/n1-vocab
          zip -r ../sakura-n1-vocabulary-package.zip data SAKURA_N1_VOCAB_QA_REPORT.md SAKURA_N1_VOCAB_SOURCES.md

      - name: Upload N1 vocabulary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sakura-n1-vocabulary
          path: |
            build/n1-vocab/data/vocabulary/n1.json
            build/n1-vocab/SAKURA_N1_VOCAB_QA_REPORT.md
            build/n1-vocab/SAKURA_N1_VOCAB_SOURCES.md
            build/sakura-n1-vocabulary-package.zip
          if-no-files-found: error
          retention-days: 7
