name: Discover Reading Garden Article topic sources

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/discover-reading-article-topic-sources.yml
      - tools/discover-reading-article-topic-sources.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Reading Garden branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: complete-open-reading-garden-20260822

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: node --check tools/discover-reading-article-topic-sources.mjs

      - name: Discover topic-balanced official sources
        run: node tools/discover-reading-article-topic-sources.mjs

      - name: Check generated reports
        run: |
          node -e "const r=require('./data/reading/qa/article-topic-source-discovery.json'); console.log(JSON.stringify({pass:r.pass, selectedCount:r.selectedCount, gaps:r.gaps, eligibleCounts:r.eligibleCounts},null,2));"
          git diff --check

      - name: Persist discovery evidence on the Reading Garden branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/reading/qa/article-topic-source-discovery.json
          if [ -f data/reading/qa/article-topic-source-candidates.json ]; then
            git add -- data/reading/qa/article-topic-source-candidates.json
          fi
          if git diff --cached --quiet; then
            echo "No discovery evidence changed."
          else
            git commit -m "Record Article topic source discovery"
            git push origin HEAD:complete-open-reading-garden-20260822
          fi

      - name: Require complete topic-balanced source set
        run: node -e "const r=require('./data/reading/qa/article-topic-source-discovery.json'); if(!r.pass){console.error('Article source discovery incomplete:',r.gaps); process.exit(1)}"
